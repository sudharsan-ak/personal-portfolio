<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="480" height="340" fill="#ffffff"/>

  <!-- Custom GPT (REST) -->
  <rect x="15" y="55" width="115" height="65" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="72" y="83" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3730a3">Custom GPT</text>
  <text x="72" y="100" text-anchor="middle" font-size="10.5" fill="#4338ca">REST Action</text>

  <!-- MCP Client -->
  <rect x="15" y="220" width="115" height="65" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="72" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b21a8">MCP Client</text>
  <text x="72" y="265" text-anchor="middle" font-size="10.5" fill="#7e22ce">ChatGPT connector</text>

  <!-- Backend -->
  <rect x="180" y="75" width="150" height="190" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
  <text x="255" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Trakt for ChatGPT</text>
  <line x1="200" y1="112" x2="310" y2="112" stroke="#7dd3fc" stroke-width="1"/>
  <text x="255" y="132" text-anchor="middle" font-size="10.5" fill="#0369a1">REST routes + MCP tools</text>
  <text x="255" y="150" text-anchor="middle" font-size="10.5" fill="#0369a1">OAuth and CSRF state</text>
  <text x="255" y="168" text-anchor="middle" font-size="10.5" fill="#0369a1">Auto token refresh</text>
  <text x="255" y="186" text-anchor="middle" font-size="10.5" fill="#0369a1">Search, then confirm, then write</text>
  <text x="255" y="204" text-anchor="middle" font-size="10.5" fill="#0369a1">Scoped read and write access</text>
  <text x="255" y="240" text-anchor="middle" font-size="10" fill="#0284c7" font-style="italic">Node.js / TypeScript</text>

  <!-- Trakt API -->
  <rect x="350" y="40" width="110" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="405" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Trakt API</text>
  <text x="405" y="88" text-anchor="middle" font-size="11" fill="#b91c1c">OAuth 2.0</text>

  <!-- Supabase -->
  <rect x="350" y="230" width="110" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="405" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Supabase</text>
  <text x="405" y="278" text-anchor="middle" font-size="11" fill="#15803d">Token storage</text>

  <!-- Arrows: entry points into backend -->
  <line x1="130" y1="88" x2="178" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="252" x2="178" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: backend to Trakt API -->
  <line x1="330" y1="140" x2="348" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="115" x2="330" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: backend to Supabase -->
  <line x1="330" y1="215" x2="348" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="260" x2="330" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="255" y="320" text-anchor="middle" font-size="10.5" fill="#64748b">One backend, two ways in, as Custom GPT Actions move to MCP</text>
</svg>
