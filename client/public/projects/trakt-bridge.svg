<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="480" height="340" fill="#ffffff"/>

  <!-- ChatGPT / Custom GPT -->
  <rect x="20" y="130" width="110" height="80" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="75" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Custom GPT</text>
  <text x="75" y="182" text-anchor="middle" font-size="11" fill="#4338ca">(ChatGPT Action)</text>

  <!-- Backend -->
  <rect x="185" y="90" width="150" height="160" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
  <text x="260" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Trakt for ChatGPT</text>
  <line x1="205" y1="128" x2="315" y2="128" stroke="#7dd3fc" stroke-width="1"/>
  <text x="260" y="148" text-anchor="middle" font-size="10.5" fill="#0369a1">OAuth + CSRF state</text>
  <text x="260" y="166" text-anchor="middle" font-size="10.5" fill="#0369a1">Auto token refresh</text>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#0369a1">Per-section endpoints</text>
  <text x="260" y="202" text-anchor="middle" font-size="10.5" fill="#0369a1">x-api-key auth</text>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#0284c7" font-style="italic">Node.js / TypeScript</text>

  <!-- Trakt API -->
  <rect x="350" y="40" width="110" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="405" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Trakt API</text>
  <text x="405" y="88" text-anchor="middle" font-size="11" fill="#b91c1c">OAuth 2.0</text>

  <!-- Supabase -->
  <rect x="350" y="230" width="110" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="405" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Supabase</text>
  <text x="405" y="278" text-anchor="middle" font-size="11" fill="#15803d">token storage</text>

  <!-- Arrows -->
  <line x1="130" y1="170" x2="183" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="157" y="163" text-anchor="middle" font-size="9.5" fill="#64748b">GET</text>

  <line x1="335" y1="140" x2="348" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="115" x2="335" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="335" y1="200" x2="348" y2="235" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="245" x2="335" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#64748b">Read-only API · one endpoint per data section</text>
</svg>
